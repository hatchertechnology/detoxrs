# cargo-vet policy for detoxrs.
#
# Reference: wiki/rust/ideal-project-setup/supply-chain.md, "cargo-vet:
# supply chain audits". Run with `cargo vet check`. Base structure
# generated by `cargo vet init` (cargo-vet 0.10.x); `[imports.*]` and
# `[policy.*]` added by hand.
#
# STATUS: the workspace has zero non-dev dependencies (see
# docs/rust-setup-notes.md). `cargo vet check` reports "Vetting Succeeded
# (because you have no third-party dependencies)" and does not even fetch
# the imports below in that state -- see docs/rust-setup-supply-chain.md.
# This file is deliberately minimal: importing Google's and Mozilla's audit
# sets now is genuinely useful (it front-loads coverage for common crates
# like serde/quote/syn that proposal doc 00 §7.2 plans to add via clap's
# derive feature), but there is nothing yet to exempt or audit ourselves, so
# `[[exemptions.*]]` entries are intentionally absent rather than
# fabricated.
#
# NOTE: `cargo vet check`/`cargo vet init` reformat this file (strip
# comments, reorder tables) when they write it. Verified locally: running
# `cargo vet check` against this exact file strips these comments on
# rewrite. If you run a cargo-vet subcommand that rewrites the store,
# re-apply these comments afterward before committing.

[cargo-vet]
version = "0.10"

[imports.google]
url = "https://raw.githubusercontent.com/google/rust-crate-audits/main/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

# detoxrs-core and detoxrs are workspace members, not published to
# crates.io (per proposal §7.1) -- exclude them from the "must be audited
# as if from crates.io" policy that would otherwise apply to every
# workspace crate.
[policy.detoxrs-core]
audit-as-crates-io = false

[policy.detoxrs]
audit-as-crates-io = false
