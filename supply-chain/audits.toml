# cargo-vet audit entries owned by this project.
#
# Generated by `cargo vet init` (cargo-vet 0.10.x); empty by design. No
# dependency exists yet for anyone to have audited. The first `cargo add`
# of a real dependency is what should populate this file -- either with a
# `[[audits.<crate>]]` entry (if someone here reviews the source) or, more
# commonly for a project this size, an `[[exemptions.<crate>]]` entry in
# supply-chain/config.toml that records an explicit, time-bounded risk
# acceptance instead. See wiki/rust/ideal-project-setup/supply-chain.md
# "Exemption discipline" and docs/rust-setup-supply-chain.md.
#
# NOTE: `cargo vet check` reformats this file (strips comments) when it
# rewrites the store. Re-apply this header after running cargo-vet
# subcommands that touch the store, before committing.

[audits]
