[workspace]
resolver = "2"
members = ["crates/detoxrs-core", "crates/detoxrs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV policy (proposal §1, restated): "stable at least 6 months old". Verified
# via `rustup toolchain install`: 1.93.0 released 2026-01-19 (>= 6 months
# before today, 2026-07-31); 1.94.0 released 2026-03-02 (only ~5 months old,
# too new). See docs/research/rust-setup-notes.md for the full derivation.
rust-version = "1.93.0"
# Dual MIT OR Apache-2.0, the Rust-ecosystem convention: see /LICENSE-MIT and
# /LICENSE-APACHE. Relicensed from BSD-3-Clause on 2026-07-31 by owner
# decision, while the project still had a single copyright holder.
license = "MIT OR Apache-2.0"
repository = "https://github.com/hatchertechnology/detoxrs"
readme = "README.md"
keywords = ["cli", "rename", "filename", "unicode", "sanitize"]
categories = ["command-line-utilities", "filesystem"]

# Versions live here so both crates inherit one number (plan §7.4's dependency
# budget is counted across the workspace, so a second version line would be a
# second entry to keep in sync, not a second dependency).
[workspace.dependencies]
# Stage 3 (NFC). Runtime dependency 1 of the 2 detoxrs-core is allowed.
unicode-normalization = "0.1"
# Stage 12's grapheme-cluster boundaries. Runtime dependency 2.
unicode-segmentation = "1"
# The CLI surface (plan §7.3). Runtime dependency 3, binary crate only.
clap = { version = "4", features = ["derive"] }
# The snapshot walk (§5.1). `follow_links(false)` is §5.6's symlink
# non-descent. Runtime dependency 4.
walkdir = "2"
# `--json`, and later the journal. Hand-escaping path-derived data into JSON is
# exactly the bug class this budget slot exists to buy off. Runtime dependency 5.
serde_json = "1"
# The no-clobber rename (§5.4). `RenameFlags::NOREPLACE` maps to `renameat2` under
# `#[cfg(linux_kernel)]` and `renameatx_np(RENAME_EXCL)` under `#[cfg(apple)]`, so one
# safe call covers both tier-1 platforms and no `libc` FFI shim exists. Declared as a
# `cfg(unix)` target dependency in the binary crate so the Windows best-effort tier keeps
# compiling on the check-then-rename path. Runtime dependency 6.
rustix = { version = "1.1", features = ["fs"] }
# Dev-dependencies deliberately do NOT live here. `just dep-budget` harvests
# `[workspace.dependencies]` as a whole and cannot tell which entries are only
# ever inherited into a `[dev-dependencies]` table, so a `proptest` line here
# counts against the 11-crate budget it is meant to be exempt from. Test-only
# crates are declared per-crate instead, with their version inline.

# Inherited by both crates via `[lints] workspace = true`. Clippy's
# unsafe-code posture is set per-crate in each crate's source root instead
# (forbid in detoxrs-core, deny in detoxrs) because they need to differ --
# see crates/detoxrs/src/main.rs for why.
[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
