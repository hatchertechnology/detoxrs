[package]
name = "detoxrs-core"
description = "Pure, I/O-free filename-transform logic for detoxrs (no clap, no std::fs)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }

# Version inline, not workspace-inherited: see the note in the workspace
# Cargo.toml. `just dep-budget` would count a workspace-level dev-dependency.
[dev-dependencies]
proptest = "1"
insta = "1"
